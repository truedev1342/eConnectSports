name: econnectsports

x-app: &app
  build:
    context: .
    target: runtime
  image: econnectsports:latest
  env_file: .env.docker
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - uploads:/app/public/system

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-idigitallsports_production}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    environment:
      DB_PREPARE: "true"
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/home > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Resque worker. QUEUE=* takes every queue, including notify_card.
  worker:
    <<: *app
    environment:
      QUEUE: "*"
      TERM_CHILD: "1"
      RESQUE_TERM_TIMEOUT: "7"
    command: bundle exec rake resque:work

  # resque-scheduler enqueues the delayed/recurring jobs.
  scheduler:
    <<: *app
    command: bundle exec rake resque:scheduler

volumes:
  postgres:
  redis:
  uploads:
