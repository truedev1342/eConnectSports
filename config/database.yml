default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  variables:
    client_min_messages: notice

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "idigitallsports_development") %>

# Warning: The database defined as "test" will be erased and re-generated when
# you run the test suite. Do not point it at development or production.
test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_NAME", "idigitallsports_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "idigitallsports_production") %>
